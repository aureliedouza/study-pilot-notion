<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Study Pilot — Time Blocking</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f5f7;

    color: #222;
}


button,
input,
select {
    font: inherit;
}


button {

    border: none;

    padding: 8px 12px;

    border-radius: 8px;

    cursor: pointer;
}


/* =====================================================
   APPLICATION
===================================================== */

.app {

    width: 100%;

    max-width: 1400px;

    margin: 20px auto;

    padding: 0 15px;
}


/* =====================================================
   CALENDRIER
===================================================== */

.calendar {

    background: white;

    border-radius: 16px;

    overflow: hidden;

    box-shadow:
        0 4px 20px rgba(0,0,0,0.08);
}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding: 18px 20px;

    border-bottom: 1px solid #eee;
}


.header-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;
}


.header h1 {

    margin: 0;

    font-size: 20px;
}


.header p {

    margin: 5px 0 0;

    color: #777;
}


.navigation {

    display: flex;

    align-items: center;

    gap: 6px;
}


.nav-button {

    background: #f0f0f2;
}


.nav-button:hover {

    background: #e5e5e8;
}


.today-button {

    background: #6366f1;

    color: white;
}


/* =====================================================
   ZONE PRINCIPALE
===================================================== */

.planning-area {

    display: grid;

    grid-template-columns:
        260px 1fr;

    min-height: 700px;
}


/* =====================================================
   SIDEBAR À PLANIFIER
===================================================== */

.planning-sidebar {

    background: #fafafa;

    border-right: 1px solid #eee;

    padding: 16px;
}


.planning-sidebar h2 {

    margin: 0;

    font-size: 16px;
}


.planning-count {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 22px;

    height: 22px;

    margin-left: 5px;

    padding: 0 6px;

    border-radius: 999px;

    background: #e8e8ff;

    color: #6366f1;

    font-size: 12px;
}


.planning-description {

    margin: 6px 0 16px;

    color: #888;

    font-size: 12px;

    line-height: 1.4;
}


.planning-list {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.planning-task {

    padding: 11px;

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 10px;

    cursor: pointer;

    transition:
        transform 0.1s,
        box-shadow 0.1s;
}


.planning-task:hover {

    transform: translateY(-1px);

    box-shadow:
        0 3px 10px rgba(0,0,0,0.06);
}


.planning-task-title {

    font-size: 13px;

    font-weight: 600;

    line-height: 1.3;
}


.planning-task-course {

    margin-top: 4px;

    font-size: 11px;

    color: #777;
}


.planning-task-deadline {

    margin-top: 7px;

    font-size: 11px;

    color: #6366f1;
}


.empty-planning {

    padding: 20px 5px;

    text-align: center;

    color: #999;

    font-size: 12px;

    line-height: 1.5;
}


.planning-error {

    padding: 12px;

    background: #fbe4e4;

    color: #a22;

    border-radius: 8px;

    font-size: 12px;

    line-height: 1.4;
}


/* =====================================================
   CALENDRIER — CONTENEUR
===================================================== */

.calendar-container {

    min-width: 0;

    overflow-x: auto;
}


/* =====================================================
   EN-TÊTE DES JOURS
===================================================== */

.week-header {

    display: grid;

    grid-template-columns:
        60px repeat(
            7,
            minmax(100px, 1fr)
        );

    border-bottom: 1px solid #eee;

    min-width: 760px;
}


.corner {

    background: #fafafa;

    border-right: 1px solid #eee;
}


.day-header {

    padding: 12px 6px;

    text-align: center;

    border-right: 1px solid #eee;

    background: white;
}


.day-header:last-child {

    border-right: none;
}


.day-name {

    font-size: 11px;

    color: #777;

    text-transform: uppercase;
}


.day-number {

    margin-top: 3px;

    font-size: 16px;

    font-weight: 600;
}


.day-header.today {

    background: #f0f0ff;
}


.day-header.today .day-number {

    color: #6366f1;
}


/* =====================================================
   CORPS DU CALENDRIER
===================================================== */

.calendar-body {

    display: grid;

    grid-template-columns:
        60px 1fr;

    min-width: 760px;
}


.hours {

    background: #fafafa;
}


.hour {

    height: 60px;

    padding: 4px 6px;

    text-align: right;

    color: #888;

    font-size: 11px;

    border-bottom: 1px solid #eee;
}


.week-grid {

    display: grid;

    grid-template-columns:
        repeat(
            7,
            minmax(100px, 1fr)
        );
}


.day {

    position: relative;

    min-width: 0;

    border-right: 1px solid #eee;
}


.day:last-child {

    border-right: none;
}


.slot {

    height: 10px;

    border-bottom: 1px solid #f0f0f0;

    position: relative;

    cursor: pointer;
}


.slot:hover {

    background: #f5f5ff;
}


/* =====================================================
   BLOCS
===================================================== */

.event {

    position: absolute;

    left: 3px;

    right: 3px;

    padding: 5px 6px;

    color: white;

    border-radius: 6px;

    font-size: 11px;

    font-weight: 500;

    cursor: pointer;

    overflow: hidden;

    z-index: 2;
}


.event:hover {

    filter: brightness(0.96);
}


.event-title {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.event-meta {

    font-size: 9px;

    opacity: 0.85;

    margin-top: 2px;
}


.event--deadline-work {

    background: #6366f1;
}


.event--learning {

    background: #10b981;
}


.event--course {

    background: #f59e0b;
}


.event--exam-review {

    background: #ec4899;
}


/* =====================================================
   MODALE
===================================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.25);

    justify-content: center;

    align-items: center;

    z-index: 100;
}


.modal-content {

    width:
        min(
            420px,
            calc(100% - 30px)
        );

    max-height: 90vh;

    overflow-y: auto;

    background: white;

    padding: 24px;

    border-radius: 16px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.2);
}


.modal-content h2 {

    margin-top: 0;
}


.form-group {

    margin-bottom: 15px;
}


.form-group label {

    display: block;

    margin-bottom: 6px;

    font-size: 13px;

    color: #666;
}


.form-group input,
.form-group select {

    width: 100%;

    padding: 10px;

    border: 1px solid #ddd;

    border-radius: 8px;

    background: white;
}


.buttons {

    display: flex;

    gap: 10px;

    justify-content: flex-end;

    margin-top: 18px;
}


.cancel {

    background: #eee;
}


.save {

    background: #6366f1;

    color: white;
}


.delete {

    margin-right: auto;

    background: #fbe4e4;

    color: #a22;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .planning-area {

        grid-template-columns:
            1fr;
    }


    .planning-sidebar {

        border-right: none;

        border-bottom: 1px solid #eee;
    }

}

</style>

</head>


<body>


<div class="app">


    <div class="calendar">


        <!-- =================================================
             HEADER
        ================================================= -->

        <div class="header">

            <div class="header-top">

                <div>

                    <h1 id="currentWeek"></h1>

                    <p>
                        Study Pilot — Time Blocking
                    </p>

                </div>


                <div class="navigation">

                    <button
                        class="nav-button"

                    >
                        ←
                    </button>

                        id="todayButton"
                        type="button"

                        id="nextWeek"
                        type="button"
                    >
                        →
                    </button>

                </div>

            </div>

        </div>


        <!-- =================================================
             ZONE PRINCIPALE
        ================================================= -->

        <div class="planning-area">


            <!-- =================================================

            ================================================= -->

            <aside class="planning-sidebar">

                <h2>

                    À planifier

                    <span
                        class="planning-count"
                        id="planningCount"
                    >
                        0
                    </span>

                <p class="planning-description">

                </p>

                    class="planning-list"

                ></div>

            <!-- =================================================
                 CALENDRIER
            ================================================= -->

                <div
                    class="week-header"

                    <div

</div>


<!-- =====================================================
     MODALE
===================================================== -->

<div

>


    <div class="modal-content">

            </label>

            <select id="taskType">

                <option value="learning">

        </div>

</div>


<script>

/* =====================================================
   STUDY PILOT
   VERSION V4 — CALENDRIER + NOTION

   Fonctionnalités :

   1. Calendrier hebdomadaire
   2. Navigation entre les semaines
   3. Création de tâches
   4. Modification de tâches
   5. Suppression d'un créneau
   6. Zone « À planifier »
   7. Récupération des tâches depuis Notion
   8. Planification d'une tâche Notion
   9. Calcul de plannedStart
   10. Stockage local des blocs
===================================================== */


/* =====================================================
   1. ÉLÉMENTS HTML
===================================================== */

const weekHeader =
    document.getElementById("weekHeader");


const hoursContainer =
    document.getElementById("hours");


const weekGrid =
    document.getElementById("weekGrid");


const currentWeekElement =
    document.getElementById("currentWeek");


const planningList =
    document.getElementById("planningList");


const planningCount =
    document.getElementById("planningCount");


const modal =
    document.getElementById("taskModal");


const modalTitle =
    document.getElementById("modalTitle");


const taskTitle =
    document.getElementById("taskTitle");


const taskType =
    document.getElementById("taskType");


const taskSubtype =
    document.getElementById("taskSubtype");


const course =
    document.getElementById("course");


const deadline =
    document.getElementById("deadline");


const taskDate =
    document.getElementById("taskDate");


const startTime =
    document.getElementById("startTime");


const endTime =
    document.getElementById("endTime");


const saveButton =
    document.getElementById("saveButton");


const deleteButton =
    document.getElementById("deleteButton");


const cancelButton =
    document.getElementById("cancelButton");


const previousWeekButton =
    document.getElementById("previousWeek");


const nextWeekButton =
    document.getElementById("nextWeek");


const todayButton =
    document.getElementById("todayButton");


/* =====================================================
   2. API NOTION
===================================================== */

const NOTION_API_URL =
    "https://study-pilot-api.vercel.app/api/notion/tasks";


/* =====================================================
   3. ÉTAT
===================================================== */

let currentDate =
    new Date();


let editingBlockId =
    null;


let planningTaskId =
    null;


/* =====================================================
   4. DONNÉES LOCALES
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem(
            "studyPilotTasksV3"
        )
    ) || {};


let timeBlocks =
    JSON.parse(
        localStorage.getItem(
            "studyPilotTimeBlocksV3"
        )
    ) || {};


/* =====================================================
   5. GÉNÉRER UN ID
===================================================== */

function generateId() {

    if (
        typeof crypto !== "undefined"
        &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (
        Date.now()
        +
        "-"
        +
        Math.random()
            .toString(36)
            .substring(2)
    );
}


/* =====================================================
   6. SAUVEGARDER LES DONNÉES
===================================================== */

function saveData() {

    localStorage.setItem(
        "studyPilotTasksV3",
        JSON.stringify(tasks)
    );


    localStorage.setItem(
        "studyPilotTimeBlocksV3",
        JSON.stringify(timeBlocks)
    );
}


/* =====================================================
   7. DATES
===================================================== */

function getDateKey(date) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;
}


function parseDateKey(dateKey) {

    const [
        year,
        month,
        day
    ] =
        dateKey
            .split("-")
            .map(Number);


    return new Date(
        year,
        month - 1,
        day
    );
}


function getMonday(date) {

    const result =
        new Date(date);


    const day =
        result.getDay();


    const difference =
        day === 0
            ? -6
            : 1 - day;


    result.setDate(
        result.getDate()
        +
        difference
    );


    result.setHours(
        0,
        0,
        0,
        0
    );


    return result;
}


/* =====================================================
   8. FORMATAGE
===================================================== */

function formatDayName(date) {

    return date
        .toLocaleDateString(
            "fr-FR",
            {
                weekday: "short"
            }
        )
        .replace(".", "")
        .toUpperCase();
}


function formatWeekTitle(monday) {

    const sunday =
        new Date(monday);


    sunday.setDate(
        sunday.getDate()
        +
        6
    );


    const mondayText =
        monday.toLocaleDateString(
            "fr-FR",
            {
                day: "numeric",
                month: "long"
            }
        );


    const sundayText =
        sunday.toLocaleDateString(
            "fr-FR",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    return `${mondayText} – ${sundayText}`;
}


function formatDeadline(dateKey) {

    if (!dateKey) {

        return "";

    }


    const date =
        parseDateKey(dateKey);


    return date.toLocaleDateString(
        "fr-FR",
        {
            day: "numeric",
            month: "long"
        }
    );
}


/* =====================================================
   9. NAVIGATION
===================================================== */

function changeWeek(amount) {

    currentDate.setDate(
        currentDate.getDate()
        +
        amount * 7
    );


    renderWeek();
}


previousWeekButton.addEventListener(
    "click",
    () => changeWeek(-1)
);


nextWeekButton.addEventListener(
    "click",
    () => changeWeek(1)
);


todayButton.addEventListener(
    "click",
    () => {

        currentDate =
            new Date();


        renderWeek();

    }
);


/* =====================================================
   10. AFFICHER LES HEURES
===================================================== */

function renderHours() {

    hoursContainer.innerHTML =
        "";


    for (
        let hour = 0;
        hour < 24;
        hour++
    ) {

        const hourElement =
            document.createElement("div");


        hourElement.className =
            "hour";


        hourElement.textContent =
            String(hour).padStart(2, "0")
            +
            ":00";


        hoursContainer.appendChild(
            hourElement
        );

    }
}


/* =====================================================
   11. AFFICHER LES JOURS
===================================================== */

function renderWeekDays() {

    weekHeader.innerHTML =
        "";


    weekGrid.innerHTML =
        "";


    const corner =
        document.createElement("div");


    corner.className =
        "corner";


    weekHeader.appendChild(
        corner
    );


    const monday =
        getMonday(currentDate);


    const todayKey =
        getDateKey(new Date());


    for (
        let dayIndex = 0;
        dayIndex < 7;
        dayIndex++
    ) {

        const date =
            new Date(monday);


        date.setDate(
            monday.getDate()
            +
            dayIndex
        );


        const dateKey =
            getDateKey(date);


        /* ---------------------------------------------
           EN-TÊTE DU JOUR
        --------------------------------------------- */

        const dayHeader =
            document.createElement("div");


        dayHeader.className =
            "day-header";


        if (
            dateKey === todayKey
        ) {

            dayHeader.classList.add(
                "today"
            );

        }


        const dayName =
            document.createElement("div");


        dayName.className =
            "day-name";


        dayName.textContent =
            formatDayName(date);


        const dayNumber =
            document.createElement("div");


        dayNumber.className =
            "day-number";


        dayNumber.textContent =
            date.getDate();


        dayHeader.appendChild(
            dayName
        );


        dayHeader.appendChild(
            dayNumber
        );


        weekHeader.appendChild(
            dayHeader
        );


        /* ---------------------------------------------
           COLONNE DU JOUR
        --------------------------------------------- */

        const day =
            document.createElement("div");


        day.className =
            "day";


        day.dataset.date =
            dateKey;


        /* ---------------------------------------------
           CRÉNEAUX DE 10 MINUTES
        --------------------------------------------- */

        for (
            let hour = 0;
            hour < 24;
            hour++
        ) {

            for (
                let minute = 0;
                minute < 60;
                minute += 10
            ) {

                const slot =
                    document.createElement("div");


                slot.className =
                    "slot";


                slot.dataset.date =
                    dateKey;


                slot.dataset.time =
                    `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;


                slot.addEventListener(
                    "click",
                    () => {

                        openCreateModal(
                            dateKey,
                            slot.dataset.time
                        );

                    }
                );


                day.appendChild(
                    slot
                );

            }

        }


        weekGrid.appendChild(
            day
        );

    }
}


/* =====================================================
   12. TEMPS
===================================================== */

function timeToMinutes(time) {

    const [
        hours,
        minutes
    ] =
        time
            .split(":")
            .map(Number);


    return (
        hours * 60
        +
        minutes
    );
}


function minutesToTime(minutes) {

    minutes =
        Math.max(
            0,
            Math.min(
                minutes,
                1439
            )
        );


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        String(hours).padStart(2, "0")
        +
        ":"
        +
        String(mins).padStart(2, "0")
    );
}


/* =====================================================
   13. SOUS-TYPES
===================================================== */

const subtypeOptions = {

    "deadline-work": [

        ["lecture", "Lecture"],

        ["td", "Travaux dirigés"],

        ["dossier", "Dossier"],

        ["oral", "Oral"]

    ],


    "learning": [

        [
            "learning",
            "Apprentissage du cours"
        ]

    ],


    "course": [

        [
            "course",
            "Cours"
        ]

    ],


    "exam-review": [

        [
            "exam-review",
            "Révision / annales"
        ]

    ]

};


function updateSubtypeOptions() {

    const type =
        taskType.value;


    taskSubtype.innerHTML =
        "";


    const options =
        subtypeOptions[type]
        ||
        [];


    options.forEach(
        ([value, label]) => {

            const option =
                document.createElement("option");


            option.value =
                value;


            option.textContent =
                label;


            taskSubtype.appendChild(
                option
            );

        }
    );
}


taskType.addEventListener(
    "change",
    updateSubtypeOptions
);


/* =====================================================
   14. TIME BLOCKS D'UNE TÂCHE
===================================================== */

function getTimeBlocksForTask(
    notionId
) {

    return Object.values(timeBlocks)
        .filter(
            block =>
                block.notionId ===
                notionId
        );
}


/* =====================================================
   15. CALCUL DE plannedStart
===================================================== */

function calculatePlannedStart(
    notionId
) {

    const blocks =
        getTimeBlocksForTask(
            notionId
        );


    if (
        blocks.length === 0
    ) {

        return "";

    }


    blocks.sort(
        (a, b) => {

            const valueA =
                `${a.date}T${a.startTime}`;


            const valueB =
                `${b.date}T${b.startTime}`;


            return valueA.localeCompare(
                valueB
            );

        }
    );


    return blocks[0].date;
}


function syncTaskPlanning(
    notionId
) {

    const task =
        Object.values(tasks)
            .find(
                item =>
                    item.notionId ===
                    notionId
            );


    if (!task) {

        return;

    }


    task.plannedStart =
        calculatePlannedStart(
            notionId
        );
}


function syncAllTasksPlanning() {

    Object.values(tasks)
        .forEach(
            task => {

                task.plannedStart =
                    calculatePlannedStart(
                        task.notionId
                    );

            }
        );
}


/* =====================================================
   16. RÉCUPÉRATION DES TÂCHES NOTION
===================================================== */

async function loadNotionTasks() {

    try {

        planningCount.textContent =
            "…";


        planningList.innerHTML =
            "";


        const response =
            await fetch(
                NOTION_API_URL
            );


        const data =
            await response.json();


        if (
            !response.ok
            ||
            !data.success
        ) {

            throw new Error(
                "Réponse API invalide."
            );

        }


        /*
           On transforme les tâches Notion
           en tâches locales utilisables
           par le calendrier.
        */

        data.tasks.forEach(
            notionTask => {

                /*
                   Si la tâche existe déjà localement,
                   on la met simplement à jour.

                   Sinon, on la crée.
                */

                let localTask =
                    Object.values(tasks)
                        .find(
                            task =>
                                task.notionId ===
                                notionTask.notionId
                        );


                if (!localTask) {

                    const localId =
                        generateId();


                    tasks[localId] = {

                        notionId:
                            notionTask.notionId,

                        title:
                            notionTask.title || "",

                        course:
                            notionTask.course || "",

                        type:
                            notionTask.type ||
                            "deadline-work",

                        subtype:
                            notionTask.subtype || "",

                        deadline:
                            notionTask.deadline || "",

                        recommendedStart:
                            notionTask.recommendedStart || "",

                        plannedStart:
                            notionTask.plannedStart || "",

                        status:
                            notionTask.status ||
                            "À faire"

                    };

                }

                else {

                    /*
                       Mise à jour des informations
                       provenant de Notion.
                    */

                    localTask.title =
                        notionTask.title || "";


                    localTask.course =
                        notionTask.course || "";


                    localTask.type =
                        notionTask.type ||
                        localTask.type ||
                        "deadline-work";


                    localTask.subtype =
                        notionTask.subtype ||
                        localTask.subtype ||
                        "";


                    localTask.deadline =
                        notionTask.deadline || "";


                    localTask.recommendedStart =
                        notionTask.recommendedStart || "";


                    localTask.status =
                        notionTask.status ||
                        localTask.status ||
                        "À faire";

                }

            }
        );


        /*
           IMPORTANT :

           plannedStart est calculé depuis les
           Time Blocks locaux.

           Cela évite que Notion écrase notre
           calendrier.
        */

        syncAllTasksPlanning();


        saveData();


        renderPlanningList();


        renderEvents();


        console.log(
            "Tâches Notion récupérées :",
            data.tasks
        );


    } catch (error) {

        console.error(
            "Erreur lors de la récupération Notion :",
            error
        );


        planningCount.textContent =
            "!";


        planningList.innerHTML = `

            <div class="planning-error">

                Impossible de récupérer
                les tâches depuis Notion.

                <br><br>

                Vérifie la console si nécessaire.

            </div>

        `;

    }

}


/* =====================================================
   17. TÂCHES À PLANIFIER
===================================================== */

function getUnplannedTasks() {

    return Object.values(tasks)
        .filter(
            task => {

                const blocks =
                    getTimeBlocksForTask(
                        task.notionId
                    );


                return (
                    blocks.length === 0
                );

            }
        );
}


/* =====================================================
   18. AFFICHER LA ZONE À PLANIFIER
===================================================== */

function renderPlanningList() {

    planningList.innerHTML =
        "";


    const unplannedTasks =
        getUnplannedTasks();


    planningCount.textContent =
        unplannedTasks.length;


    if (
        unplannedTasks.length === 0
    ) {

        const empty =
            document.createElement("div");


        empty.className =
            "empty-planning";


        empty.textContent =
            "Aucune tâche à planifier.";


        planningList.appendChild(
            empty
        );


        return;

    }


    /*
       Les tâches avec échéance
       apparaissent en premier.
    */

    unplannedTasks.sort(
        (a, b) => {

            if (
                !a.deadline
                &&
                !b.deadline
            ) {

                return 0;

            }


            if (!a.deadline) {

                return 1;

            }


            if (!b.deadline) {

                return -1;

            }


            return a.deadline.localeCompare(
                b.deadline
            );

        }
    );


    unplannedTasks.forEach(
        task => {

            const card =
                document.createElement("div");


            card.className =
                "planning-task";


            /* -----------------------------------------
               TITRE
            ----------------------------------------- */

            const title =
                document.createElement("div");


            title.className =
                "planning-task-title";


            title.textContent =
                task.title ||
                "Tâche sans nom";


            card.appendChild(
                title
            );


            /* -----------------------------------------
               COURS
            ----------------------------------------- */

            if (task.course) {

                const courseElement =
                    document.createElement("div");


                courseElement.className =
                    "planning-task-course";


                courseElement.textContent =
                    task.course;


                card.appendChild(
                    courseElement
                );

            }


            /* -----------------------------------------
               ÉCHÉANCE
            ----------------------------------------- */

            if (task.deadline) {

                const deadlineElement =
                    document.createElement("div");


                deadlineElement.className =
                    "planning-task-deadline";


                deadlineElement.textContent =
                    "Échéance : "
                    +
                    formatDeadline(
                        task.deadline
                    );


                card.appendChild(
                    deadlineElement
                );

            }


            /* -----------------------------------------
               CLIC
            ----------------------------------------- */

            card.addEventListener(
                "click",
                () => {

                    openPlanningTask(
                        task.notionId
                    );

                }
            );


            planningList.appendChild(
                card
            );

        }
    );
}


/* =====================================================
   19. OUVRIR UNE TÂCHE À PLANIFIER
===================================================== */

function openPlanningTask(
    notionId
) {

    const task =
        Object.values(tasks)
            .find(
                item =>
                    item.notionId ===
                    notionId
            );


    if (!task) {

        return;

    }


    planningTaskId =
        notionId;


    editingBlockId =
        null;


    modalTitle.textContent =
        "Planifier la tâche";


    deleteButton.style.display =
        "none";


    taskTitle.value =
        task.title || "";


    taskType.value =
        task.type ||
        "deadline-work";


    updateSubtypeOptions();


    if (task.subtype) {

        taskSubtype.value =
            task.subtype;

    }


    course.value =
        task.course || "";


    deadline.value =
        task.deadline || "";


    /*
       Date par défaut :
       aujourd'hui.
    */

    const now =
        new Date();


    const roundedMinutes =
        Math.ceil(
            now.getMinutes() / 10
        ) * 10;


    let defaultDate =
        getDateKey(now);


    let defaultStartMinutes =
        now.getHours() * 60
        +
        roundedMinutes;


    if (
        defaultStartMinutes >= 1440
    ) {

        defaultStartMinutes =
            0;


        const tomorrow =
            new Date(now);


        tomorrow.setDate(
            tomorrow.getDate()
            +
            1
        );


        defaultDate =
            getDateKey(
                tomorrow
            );

    }


    taskDate.value =
        defaultDate;


    startTime.value =
        minutesToTime(
            defaultStartMinutes
        );


    endTime.value =
        minutesToTime(
            defaultStartMinutes
            +
            60
        );


    modal.style.display =
        "flex";

}


/* =====================================================
   20. CRÉER UN TIME BLOCK
===================================================== */

function createTimeBlock(
    notionId,
    data
) {

    const blockId =
        generateId();


    timeBlocks[blockId] = {

        id:
            blockId,

        notionId:
            notionId,

        date:
            data.date,

        startTime:
            data.startTime,

        endTime:
            data.endTime

    };


    return blockId;
}


/* =====================================================
   21. OUVRIR MODALE — NOUVELLE TÂCHE
===================================================== */

function openCreateModal(
    date,
    time
) {

    planningTaskId =
        null;


    editingBlockId =
        null;


    modalTitle.textContent =
        "Ajouter une tâche";


    deleteButton.style.display =
        "none";


    taskTitle.value =
        "";


    taskType.value =
        "deadline-work";


    updateSubtypeOptions();


    taskSubtype.value =
        "td";


    course.value =

    deadline.value =
        "";


    taskDate.value =
        date;


    startTime.value =
        time;


    endTime.value =
        minutesToTime(
            timeToMinutes(time)
            +
            60
        );

    taskTitle.focus();

}


/* =====================================================
   22. OUVRIR MODALE — MODIFICATION
===================================================== */

function openEditModal(
    blockId
) {

    const block =
        timeBlocks[blockId];


    if (!block) {

        return;

    }


    const task =
        Object.values(tasks)
            .find(
                item =>
                    item.notionId ===
                    block.notionId
            );


    if (!task) {

        return;

    }


    planningTaskId =
        null;


    editingBlockId =
        blockId;


    modalTitle.textContent =
        "Modifier la tâche";


    deleteButton.style.display =
        "block";


    taskTitle.value =
        task.title || "";


    taskType.value =
        task.type ||
        "deadline-work";


    updateSubtypeOptions();


    if (task.subtype) {

        taskSubtype.value =
            task.subtype;

    }


    course.value =
        task.course || "";


    deadline.value =
        task.deadline || "";


    taskDate.value =
        block.date;


    startTime.value =
        block.startTime;


    endTime.value =
        block.endTime;


    modal.style.display =
        "flex";


    taskTitle.focus();

}


/* =====================================================
   23. FERMER LA MODALE
===================================================== */

function closeModal() {

    modal.style.display =
        "none";


    editingBlockId =
        null;


    planningTaskId =
        null;
}


cancelButton.addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);


/* =====================================================
   24. ENREGISTRER UNE TÂCHE
===================================================== */

saveButton.addEventListener(
    "click",
    saveTask
);


function saveTask() {

    const title =
        taskTitle.value.trim();


    if (!title) {

        alert(
            "Ajoute un nom à la tâche."
        );

        return;

    }


    const data = {

        title:
            title,

        type:
            taskType.value,

        subtype:
            taskSubtype.value,

        course:
            course.value.trim(),

        deadline:
            deadline.value,

        date:
            taskDate.value,

        startTime:
            startTime.value,

        endTime:
            endTime.value

    };


    if (
        !data.date
        ||
        !data.startTime
        ||
        !data.endTime
    ) {

        alert(
            "La date et les horaires sont nécessaires."
        );

        return;

    }


    if (
        timeToMinutes(
            data.endTime
        )
        <=
        timeToMinutes(
            data.startTime
        )
    ) {

        alert(
            "L'heure de fin doit être après l'heure de début."
        );

        return;

    }


    /* =================================================
       CAS 1 — PLANIFIER UNE TÂCHE NOTION
    ================================================= */

    if (planningTaskId) {

        const task =
            Object.values(tasks)
                .find(
                    item =>
                        item.notionId ===
                        planningTaskId
                );


        if (!task) {

            return;

        }


        task.title =
            data.title;


        task.type =
            data.type;


        task.subtype =
            data.subtype;


        task.course =
            data.course;


        task.deadline =
            data.deadline;


        createTimeBlock(
            task.notionId,
            data
        );


        syncTaskPlanning(
            task.notionId
        );

    }


    /* =================================================
       CAS 2 — MODIFIER UN TIME BLOCK
    ================================================= */

    else if (editingBlockId) {

        const block =
            timeBlocks[
                editingBlockId
            ];


        if (!block) {

            return;

        }


        const task =
            Object.values(tasks)
                .find(
                    item =>
                        item.notionId ===
                        block.notionId
                );


        if (!task) {

            return;

        }


        task.title =
            data.title;


        task.type =
            data.type;


        task.subtype =
            data.subtype;


        task.course =
            data.course;


        task.deadline =
            data.deadline;


        block.date =
            data.date;


        block.startTime =
            data.startTime;


        block.endTime =
            data.endTime;


        syncTaskPlanning(
            task.notionId
        );

    }


    /* =================================================
       CAS 3 — CRÉER UNE NOUVELLE TÂCHE
    ================================================= */

    else {

        const taskId =
            generateId();


        tasks[taskId] = {

            notionId:
                taskId,

            title:
                data.title,

            course:
                data.course,

            type:
                data.type,

            subtype:
                data.subtype,

            deadline:
                data.deadline,

            recommendedStart:
                "",

            plannedStart:
                "",

            status:
                "À faire"

        };


        createTimeBlock(
            taskId,
            data
        );


        syncTaskPlanning(
            taskId
        );

    }


    syncAllTasksPlanning();


    saveData();


    closeModal();


    currentDate =
        parseDateKey(
            data.date
        );


    renderWeek();

}


/* =====================================================
   25. AFFICHER LES TIME BLOCKS
===================================================== */

function renderEvents() {

    document
        .querySelectorAll(".event")
        .forEach(
            event =>
                event.remove()
        );


    Object.values(timeBlocks)
        .forEach(
            block => {

                const day =
                    weekGrid.querySelector(
                        `.day[data-date="${block.date}"]`
                    );


                if (!day) {

                    return;

                }


                const task =
                    Object.values(tasks)
                        .find(
                            item =>
                                item.notionId ===
                                block.notionId
                        );


                if (!task) {

                    return;

                }


                const start =
                    timeToMinutes(
                        block.startTime
                    );


                const end =
                    timeToMinutes(
                        block.endTime
                    );


                const duration =
                    end - start;


                const event =
                    document.createElement("div");


                event.className =
                    "event event--"
                    +
                    task.type;


                event.style.top =
                    start + "px";


                event.style.height =
                    Math.max(
                        duration - 4,
                        10
                    )
                    +
                    "px";


                const title =
                    document.createElement("div");


                title.className =
                    "event-title";


                title.textContent =
                    task.title;


                const meta =
                    document.createElement("div");


                meta.className =
                    "event-meta";


                meta.textContent =
                    `${block.startTime} – ${block.endTime}`;


                event.appendChild(
                    title
                );


                event.appendChild(
                    meta
                );


                event.addEventListener(
                    "click",
                    eventClick => {

                        eventClick.stopPropagation();


                        openEditModal(
                            block.id
                        );

                    }
                );


                day.appendChild(
                    event
                );

            }
        );
}


/* =====================================================
   26. SUPPRIMER UN TIME BLOCK
===================================================== */

deleteButton.addEventListener(
    "click",
    deleteCurrentBlock
);


function deleteCurrentBlock() {

    if (!editingBlockId) {

        return;

    }


    const block =
        timeBlocks[
            editingBlockId
        ];


    if (!block) {

        closeModal();

        return;

    }


    const notionId =
        block.notionId;


    delete timeBlocks[
        editingBlockId
    ];


    syncTaskPlanning(
        notionId
    );


    saveData();


    closeModal();


    renderWeek();

}


/* =====================================================
   27. RENDU COMPLET DU CALENDRIER
===================================================== */

function renderWeek() {

    const monday =
        getMonday(
            currentDate
        );


    currentWeekElement.textContent =
        formatWeekTitle(
            monday
        );


    renderHours();


    renderWeekDays();


    syncAllTasksPlanning();


    saveData();


    renderEvents();


    renderPlanningList();

}


/* =====================================================
   28. INITIALISATION
===================================================== */

function initialize() {

    updateSubtypeOptions();

    renderWeek();

    loadNotionTasks();

}


initialize();
